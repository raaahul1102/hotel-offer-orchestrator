services:
  redis:
    image: redis:7-alpine
    container_name: hoo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Temporal auto-setup bundles server + a Postgres-backed dev store.
  temporal-postgres:
    image: postgres:15-alpine
    container_name: hoo-temporal-postgres
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: hoo-temporal
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    container_name: hoo-worker
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      ROLE: worker
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      # The worker's activities call the API's mock supplier endpoints.
      SUPPLIER_BASE_URL: http://api:3000
      TEMPORAL_TASK_QUEUE: hotel-orchestrator

  api:
    build: .
    container_name: hoo-api
    depends_on:
      redis:
        condition: service_healthy
      temporal:
        condition: service_healthy
    environment:
      ROLE: api
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TEMPORAL_ADDRESS: temporal:7233
      SUPPLIER_BASE_URL: http://localhost:3000
      TEMPORAL_TASK_QUEUE: hotel-orchestrator
    ports:
      # Host port configurable via API_PORT, defaults to 3000 (Requirement 8.3).
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
